<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily Dashboard</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e4e2db; --accent: #2f5d50; --accent-soft: #e3eee9; --warn: #b4572a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513; --card: #1d1f1c; --text: #ecebe6; --muted: #9b9a94;
      --line: #2b2d29; --accent: #7fb8a4; --accent-soft: #233029; --warn: #e0905f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  header .date { color: var(--muted); font-size: 15px; }
  .status { font-size: 13px; color: var(--muted); }
  .status.sample { color: var(--warn); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  section h2 { font-size: 17px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  section h2 .tag { font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
  .brief-item { padding: 12px 0; border-top: 1px solid var(--line); }
  .brief-item:first-of-type { border-top: 0; padding-top: 0; }
  .brief-item h3 { font-size: 15px; margin: 0 0 4px; }
  .brief-item p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 6px 12px; border-radius: 99px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topic-item { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .topic-item:first-child { border-top: 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .sched-form { display: grid; gap: 8px; margin-bottom: 12px; }
  .sched-form .row { display: flex; gap: 8px; }
  .sched-form .row > * { flex: 1; min-width: 0; }
  .sched-form label.allday { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  input, button.add {
    font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=date], input[type=time] { color-scheme: light dark; }
  button.add { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  .cal-frame { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .cal-help { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; }
  .links a { display: block; padding: 6px 0; font-size: 14px; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My Daily Dashboard</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="status sample" id="status">샘플 데이터 표시 중</div>
  </header>

  <div class="grid">
    <div>
      <section>
        <h2>오늘의 뉴스 정리 <span class="tag">AI 요약</span></h2>
        <div id="briefing"></div>
      </section>

      <section>
        <h2>관심 주제 모니터링</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div id="topic-list"></div>
      </section>
    </div>

    <div>
      <section>
        <h2>일정 <span class="tag">구글 캘린더 연동</span></h2>
        <form class="sched-form" id="sched-form">
          <input type="text" id="s-title" placeholder="일정 내용" aria-label="일정 내용" required>
          <div class="row">
            <input type="date" id="s-date" aria-label="날짜" required>
            <input type="time" id="s-time" aria-label="시간">
          </div>
          <label class="allday"><input type="checkbox" id="s-allday"> 종일 일정 (시간 없음)</label>
          <button class="add" type="submit">구글 캘린더에 추가</button>
        </form>
        <div id="cal-box"></div>
        <div class="meta" style="margin-top:10px">추가를 누르면 구글 캘린더 창이 열리고, 거기서 저장을 누르면 폰과 PC에 같이 반영됩니다.</div>
      </section>

      <section>
        <h2>바로가기</h2>
        <div class="links">
          <a href="https://www.applyhome.co.kr" target="_blank" rel="noopener">청약Home →</a>
          <a href="https://calendar.google.com" target="_blank" rel="noopener">구글 캘린더 →</a>
          <a href="https://www.molit.go.kr" target="_blank" rel="noopener">국토교통부 →</a>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* ---------- 샘플 데이터 (3단계 자동화가 data.json을 만들면 이 내용은 자동으로 대체됨) ---------- */
const SAMPLE = {
  updated: null,
  briefing: [
    { title: "[샘플] 오늘의 핵심 뉴스 제목이 여기에 들어갑니다", summary: "AI가 여러 기사를 읽고 2~3문장으로 요약한 내용이 표시되는 자리입니다.", source: "출처 언론사", url: "#" },
    { title: "[샘플] 두 번째 뉴스", summary: "자동화가 연결되면 매일 아침 이 목록이 새로 채워집니다.", source: "출처 언론사", url: "#" },
    { title: "[샘플] 세 번째 뉴스", summary: "관심 주제와 관련된 기사가 우선적으로 선별되도록 만들 수 있습니다.", source: "출처 언론사", url: "#" }
  ],
  topics: {
    "부동산 정책": [{ title: "[샘플] 부동산 정책 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "반도체":     [{ title: "[샘플] 반도체 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "AI":         [{ title: "[샘플] AI 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "양자컴퓨터": [{ title: "[샘플] 양자컴퓨터 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "청약":       [{ title: "[샘플] 청약 일정·공고 관련 기사 제목", source: "출처", date: "", url: "#" }]
  }
};

const TOPICS = ["부동산 정책", "반도체", "AI", "양자컴퓨터", "청약"];

/* ---------- 유틸 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//.test(u) ? u : "#";

/* ---------- 날짜 ---------- */
$("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

/* ---------- 데이터 불러오기: data.json이 있으면 그걸 쓰고, 없으면 샘플 ---------- */
async function loadData() {
  try {
    const res = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("no data.json");
    const data = await res.json();
    const st = $("status");
    st.textContent = data.updated ? "마지막 업데이트: " + data.updated : "";
    st.classList.remove("sample");
    return data;
  } catch (e) {
    return SAMPLE;
  }
}

/* ---------- 뉴스 브리핑 ---------- */
function renderBriefing(items) {
  $("briefing").innerHTML = (items && items.length)
    ? items.map(n => `
      <div class="brief-item">
        <h3><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.title)}</a></h3>
        <p>${esc(n.summary)}</p>
        <div class="meta">${esc(n.source)}</div>
      </div>`).join("")
    : `<div class="empty">오늘 정리된 뉴스가 없습니다.</div>`;
}

/* ---------- 관심 주제 ---------- */
let current = TOPICS[0];
function renderTopics(topics) {
  $("tabs").innerHTML = TOPICS.map(t =>
    `<button class="tab" role="tab" aria-selected="${t === current}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  const list = (topics && topics[current]) || [];
  $("topic-list").innerHTML = list.length
    ? list.map(a => `
      <div class="topic-item">
        <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.title)}</a>
        <div class="meta">${esc(a.source)}${a.date ? " · " + esc(a.date) : ""}</div>
      </div>`).join("")
    : `<div class="empty">새 소식이 없습니다.</div>`;
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.t; renderTopics(topics); });
}

/* ---------- 일정: 구글 캘린더 연동 ---------- */
// 구글 캘린더의 '캘린더 ID'를 따옴표 안에 붙여넣으세요. 비워 두면 안내 문구가 보입니다.
const CALENDAR_ID = "00bec69b0a588e9b45dddb68a50ad6e853ded326dfa3416fad6d3afdb3767b6a@group.calendar.google.com";

const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const ymdhms = (d) => `${ymd(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

// 날짜/시간을 고르면 '미리 채워진 구글 캘린더 일정 만들기 창' 주소를 만들어 줍니다.
function calendarLink(title, dateStr, timeStr, allDay) {
  const [y, m, d] = dateStr.split("-").map(Number);
  let dates;
  if (allDay || !timeStr) {
    dates = `${ymd(new Date(y, m - 1, d))}/${ymd(new Date(y, m - 1, d + 1))}`;
  } else {
    const [hh, mm] = timeStr.split(":").map(Number);
    dates = `${ymdhms(new Date(y, m - 1, d, hh, mm))}/${ymdhms(new Date(y, m - 1, d, hh + 1, mm))}`;
  }
  const p = new URLSearchParams({ action: "TEMPLATE", text: title, dates, ctz: "Asia/Seoul" });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// 날짜 칸의 기본값은 오늘
const now = new Date();
$("s-date").value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

// 종일 일정이면 시간 칸을 끕니다
$("s-allday").onchange = (e) => {
  $("s-time").disabled = e.target.checked;
  if (e.target.checked) $("s-time").value = "";
};

$("sched-form").onsubmit = (e) => {
  e.preventDefault();
  const title = $("s-title").value.trim();
  const date = $("s-date").value;
  if (!title || !date) return;
  const url = calendarLink(title, date, $("s-time").value, $("s-allday").checked);
  window.open(url, "_blank", "noopener");
  $("s-title").value = "";
};

// 구글 캘린더에 등록된 일정을 목록으로 보여주는 창
function renderCalendar() {
  if (!CALENDAR_ID) {
    $("cal-box").innerHTML = `<div class="cal-help"><b>일정 목록을 여기에 표시하려면 한 가지 설정이 필요해요.</b><br>
      구글 캘린더 → 설정 → 내 캘린더의 설정 → '캘린더 통합'에서 <b>캘린더 ID</b>를 복사해 index.html의 <code>CALENDAR_ID</code> 따옴표 안에 붙여넣으세요.</div>`;
    return;
  }
  const src = "https://calendar.google.com/calendar/embed?src=" + encodeURIComponent(CALENDAR_ID) +
    "&ctz=Asia%2FSeoul&mode=AGENDA&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0";
  $("cal-box").innerHTML = `<iframe class="cal-frame" src="${src}" title="구글 캘린더 일정"></iframe>`;
}

/* ---------- 시작 ---------- */
renderCalendar();
loadData().then(d => { renderBriefing(d.briefing); renderTopics(d.topics); });
</script>
</body>
</html>
