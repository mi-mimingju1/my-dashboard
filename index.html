<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily Dashboard</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e4e2db; --accent: #2f5d50; --accent-soft: #e3eee9; --warn: #b4572a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513; --card: #1d1f1c; --text: #ecebe6; --muted: #9b9a94;
      --line: #2b2d29; --accent: #7fb8a4; --accent-soft: #233029; --warn: #e0905f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  header .date { color: var(--muted); font-size: 15px; }
  .status { font-size: 13px; color: var(--muted); }
  .status.sample { color: var(--warn); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  section h2 { font-size: 17px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  section h2 .tag { font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
  .brief-item { padding: 12px 0; border-top: 1px solid var(--line); }
  .brief-item:first-of-type { border-top: 0; padding-top: 0; }
  .brief-item h3 { font-size: 15px; margin: 0 0 4px; }
  .brief-item p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 6px 12px; border-radius: 99px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topic-item { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .topic-item:first-child { border-top: 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .sched-form { display: grid; gap: 8px; margin-bottom: 12px; }
  .sched-form .row { display: flex; gap: 8px; }
  .sched-form .row > * { flex: 1; min-width: 0; }
  .sched-form label.allday { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  input, button.add {
    font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=date], input[type=time] { color-scheme: light dark; }
  button.add { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  .cal-frame { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .cal-help { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; }
  .links a { display: block; padding: 6px 0; font-size: 14px; color: var(--accent); }

  /* ---------- 꾸미기(테마) ---------- */
  .wrap { position: relative; z-index: 1; }
  #bg-layer, #bg-shade { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #bg-layer { background-size: cover; background-position: center; background-repeat: no-repeat; }
  #bg-shade { background: #000; opacity: 0; }
  .has-bg section, .has-bg header {
    background: color-mix(in srgb, var(--card) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .has-bg header { border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  button.paint {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #theme-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 100%); z-index: 20;
    background: var(--card); color: var(--text); border-left: 1px solid var(--line);
    padding: 20px; overflow-y: auto; transform: translateX(100%); transition: transform .2s;
    box-shadow: -8px 0 30px rgba(0,0,0,.15);
  }
  #theme-panel.open { transform: none; }
  #theme-panel h3 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  #theme-panel h4 { margin: 20px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #theme-panel .close { background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .swatch {
    border: 2px solid var(--line); border-radius: 10px; padding: 8px 6px; cursor: pointer;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 12px; text-align: center;
  }
  .swatch i { display: block; height: 22px; border-radius: 6px; margin-bottom: 6px; }
  .swatch[aria-pressed="true"] { border-color: var(--accent); }
  .panel-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .panel-row input[type=range] { flex: 1; padding: 0; }
  .panel-row input[type=color] { width: 44px; height: 32px; padding: 2px; }
  .btn-sm {
    border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .panel-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .slot { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .slot-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .slot-head .now { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 99px; }
  .slot-thumb { height: 64px; border-radius: 8px; background: var(--bg) center/cover no-repeat; border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .slot .panel-row { margin-top: 8px; }
</style>
</head>
<body>
<div id="bg-layer"></div><div id="bg-shade"></div>
<aside id="theme-panel" aria-label="꾸미기 설정">
  <h3>🎨 꾸미기 <button class="close" id="panel-close" type="button" aria-label="닫기">×</button></h3>

  <h4>색상 테마</h4>
  <div class="swatches" id="swatches"></div>

  <h4>포인트 색</h4>
  <div class="panel-row">
    <input type="color" id="accent-pick" aria-label="포인트 색">
    <button class="btn-sm" id="accent-reset" type="button">테마 색으로</button>
  </div>

  <h4>배경 사진</h4>
  <div class="panel-note" id="device-now" style="margin:0 0 10px"></div>
  <div id="slots"></div>

  <h4>초기화</h4>
  <button class="btn-sm" id="theme-reset" type="button">모두 기본값으로</button>
</aside>
<div class="wrap">
  <header>
    <div>
      <h1>My Daily Dashboard</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="head-right">
      <div class="status sample" id="status">샘플 데이터 표시 중</div>
      <button class="paint" id="paint-btn" type="button">🎨 꾸미기</button>
    </div>
  </header>

  <div class="grid">
    <div>
      <section>
        <h2>오늘의 뉴스 정리 <span class="tag">AI 요약</span></h2>
        <div id="briefing"></div>
      </section>

      <section>
        <h2>관심 주제 모니터링</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div id="topic-list"></div>
      </section>
    </div>

    <div>
      <section>
        <h2>일정 <span class="tag">구글 캘린더 연동</span></h2>
        <form class="sched-form" id="sched-form">
          <input type="text" id="s-title" placeholder="일정 내용" aria-label="일정 내용" required>
          <div class="row">
            <input type="date" id="s-date" aria-label="날짜" required>
            <input type="time" id="s-time" aria-label="시간">
          </div>
          <label class="allday"><input type="checkbox" id="s-allday"> 종일 일정 (시간 없음)</label>
          <button class="add" type="submit">구글 캘린더에 추가</button>
        </form>
        <div id="cal-box"></div>
        <div class="meta" style="margin-top:10px">추가를 누르면 구글 캘린더 창이 열리고, 거기서 저장을 누르면 폰과 PC에 같이 반영됩니다.</div>
      </section>

      <section>
        <h2>바로가기</h2>
        <div class="links">
          <a href="https://www.applyhome.co.kr" target="_blank" rel="noopener">청약Home →</a>
          <a href="https://calendar.google.com" target="_blank" rel="noopener">구글 캘린더 →</a>
          <a href="https://www.molit.go.kr" target="_blank" rel="noopener">국토교통부 →</a>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* ---------- 샘플 데이터 (3단계 자동화가 data.json을 만들면 이 내용은 자동으로 대체됨) ---------- */
const SAMPLE = {
  updated: null,
  briefing: [
    { title: "[샘플] 오늘의 핵심 뉴스 제목이 여기에 들어갑니다", summary: "AI가 여러 기사를 읽고 2~3문장으로 요약한 내용이 표시되는 자리입니다.", source: "출처 언론사", url: "#" },
    { title: "[샘플] 두 번째 뉴스", summary: "자동화가 연결되면 매일 아침 이 목록이 새로 채워집니다.", source: "출처 언론사", url: "#" },
    { title: "[샘플] 세 번째 뉴스", summary: "관심 주제와 관련된 기사가 우선적으로 선별되도록 만들 수 있습니다.", source: "출처 언론사", url: "#" }
  ],
  topics: {
    "부동산 정책": [{ title: "[샘플] 부동산 정책 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "반도체":     [{ title: "[샘플] 반도체 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "AI":         [{ title: "[샘플] AI 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "양자컴퓨터": [{ title: "[샘플] 양자컴퓨터 관련 기사 제목", source: "출처", date: "", url: "#" }],
    "청약":       [{ title: "[샘플] 청약 일정·공고 관련 기사 제목", source: "출처", date: "", url: "#" }]
  }
};

const TOPICS = ["부동산 정책", "반도체", "AI", "양자컴퓨터", "청약"];

/* ---------- 유틸 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//.test(u) ? u : "#";

/* ---------- 날짜 ---------- */
$("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

/* ---------- 데이터 불러오기: data.json이 있으면 그걸 쓰고, 없으면 샘플 ---------- */
async function loadData() {
  try {
    const res = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("no data.json");
    const data = await res.json();
    const st = $("status");
    st.textContent = data.updated ? "마지막 업데이트: " + data.updated : "";
    st.classList.remove("sample");
    return data;
  } catch (e) {
    return SAMPLE;
  }
}

/* ---------- 뉴스 브리핑 ---------- */
function renderBriefing(items) {
  $("briefing").innerHTML = (items && items.length)
    ? items.map(n => `
      <div class="brief-item">
        <h3><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.title)}</a></h3>
        <p>${esc(n.summary)}</p>
        <div class="meta">${esc(n.source)}</div>
      </div>`).join("")
    : `<div class="empty">오늘 정리된 뉴스가 없습니다.</div>`;
}

/* ---------- 관심 주제 ---------- */
let current = TOPICS[0];
function renderTopics(topics) {
  $("tabs").innerHTML = TOPICS.map(t =>
    `<button class="tab" role="tab" aria-selected="${t === current}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  const list = (topics && topics[current]) || [];
  $("topic-list").innerHTML = list.length
    ? list.map(a => `
      <div class="topic-item">
        <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.title)}</a>
        <div class="meta">${esc(a.source)}${a.date ? " · " + esc(a.date) : ""}</div>
      </div>`).join("")
    : `<div class="empty">새 소식이 없습니다.</div>`;
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.t; renderTopics(topics); });
}

/* ---------- 일정: 구글 캘린더 연동 ---------- */
// 구글 캘린더의 '캘린더 ID'를 따옴표 안에 붙여넣으세요. 비워 두면 안내 문구가 보입니다.
const CALENDAR_ID = "00bec69b0a588e9b45dddb68a50ad6e853ded326dfa3416fad6d3afdb3767b6a@group.calendar.google.com";

const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const ymdhms = (d) => `${ymd(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

// 날짜/시간을 고르면 '미리 채워진 구글 캘린더 일정 만들기 창' 주소를 만들어 줍니다.
function calendarLink(title, dateStr, timeStr, allDay) {
  const [y, m, d] = dateStr.split("-").map(Number);
  let dates;
  if (allDay || !timeStr) {
    dates = `${ymd(new Date(y, m - 1, d))}/${ymd(new Date(y, m - 1, d + 1))}`;
  } else {
    const [hh, mm] = timeStr.split(":").map(Number);
    dates = `${ymdhms(new Date(y, m - 1, d, hh, mm))}/${ymdhms(new Date(y, m - 1, d, hh + 1, mm))}`;
  }
  const p = new URLSearchParams({ action: "TEMPLATE", text: title, dates, ctz: "Asia/Seoul" });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// 날짜 칸의 기본값은 오늘
const now = new Date();
$("s-date").value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

// 종일 일정이면 시간 칸을 끕니다
$("s-allday").onchange = (e) => {
  $("s-time").disabled = e.target.checked;
  if (e.target.checked) $("s-time").value = "";
};

$("sched-form").onsubmit = (e) => {
  e.preventDefault();
  const title = $("s-title").value.trim();
  const date = $("s-date").value;
  if (!title || !date) return;
  const url = calendarLink(title, date, $("s-time").value, $("s-allday").checked);
  window.open(url, "_blank", "noopener");
  $("s-title").value = "";
};

// 구글 캘린더에 등록된 일정을 목록으로 보여주는 창
function renderCalendar() {
  if (!CALENDAR_ID) {
    $("cal-box").innerHTML = `<div class="cal-help"><b>일정 목록을 여기에 표시하려면 한 가지 설정이 필요해요.</b><br>
      구글 캘린더 → 설정 → 내 캘린더의 설정 → '캘린더 통합'에서 <b>캘린더 ID</b>를 복사해 index.html의 <code>CALENDAR_ID</code> 따옴표 안에 붙여넣으세요.</div>`;
    return;
  }
  const src = "https://calendar.google.com/calendar/embed?src=" + encodeURIComponent(CALENDAR_ID) +
    "&ctz=Asia%2FSeoul&mode=AGENDA&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0";
  $("cal-box").innerHTML = `<iframe class="cal-frame" src="${src}" title="구글 캘린더 일정"></iframe>`;
}

/* ---------- 꾸미기(테마) ---------- */
const PRESETS = [
  { id: "auto",  name: "기본(자동)", prev: "#2f5d50", vars: null },
  { id: "cream", name: "크림", prev: "#f6f5f1", vars: { "--bg":"#f6f5f1","--card":"#ffffff","--text":"#1d1d1b","--muted":"#6b6a66","--line":"#e4e2db","--accent":"#2f5d50" } },
  { id: "blue",  name: "블루", prev: "#2f5fd0", vars: { "--bg":"#eef3fa","--card":"#ffffff","--text":"#14213d","--muted":"#5c6b85","--line":"#d8e1ef","--accent":"#2f5fd0" } },
  { id: "pink",  name: "핑크", prev: "#c2456b", vars: { "--bg":"#fbf1f3","--card":"#ffffff","--text":"#3a1d26","--muted":"#86656f","--line":"#f0d9de","--accent":"#c2456b" } },
  { id: "dark",  name: "다크", prev: "#1d1f1c", vars: { "--bg":"#141513","--card":"#1d1f1c","--text":"#ecebe6","--muted":"#9b9a94","--line":"#2b2d29","--accent":"#7fb8a4" } },
  { id: "night", name: "밤보라", prev: "#a78bfa", vars: { "--bg":"#17141f","--card":"#211d2c","--text":"#eeeaf6","--muted":"#a49bb8","--line":"#342e44","--accent":"#a78bfa" } }
];
const SLOTS = [
  { id: "pc",    label: "🖥 PC 화면 (넓은 화면)", max: 1600 },
  { id: "phone", label: "📱 폰 화면 (좁은 화면)", max: 1200 }
];
const T_KEY = "dash-theme-v1";
const bgKey = (id) => `dash-bg-${id}-v1`;
const phoneMQ = window.matchMedia("(max-width: 800px)");
const activeSlot = () => phoneMQ.matches ? "phone" : "pc";

let theme = { preset: "auto", accent: null, dark: { pc: 25, phone: 25 } };
try {
  const saved = JSON.parse(localStorage.getItem(T_KEY) || "{}");
  Object.assign(theme, saved);
  if (typeof theme.dark !== "object" || theme.dark === null) theme.dark = { pc: +saved.dark || 25, phone: +saved.dark || 25 };
} catch (e) {}
const saveTheme = () => { try { localStorage.setItem(T_KEY, JSON.stringify(theme)); } catch (e) {} };
const getBg = (id) => { try { return localStorage.getItem(bgKey(id)); } catch (e) { return null; } };

// 예전 버전에서 저장한 사진이 있으면 PC 칸으로 옮겨 줍니다
try {
  const old = localStorage.getItem("dash-bg-v1");
  if (old && !getBg("pc")) localStorage.setItem(bgKey("pc"), old);
  if (old) localStorage.removeItem("dash-bg-v1");
} catch (e) {}

function applyTheme() {
  const root = document.documentElement.style;
  ["--bg","--card","--text","--muted","--line","--accent","--accent-soft"].forEach(v => root.removeProperty(v));
  const p = PRESETS.find(x => x.id === theme.preset) || PRESETS[0];
  if (p.vars) Object.entries(p.vars).forEach(([k, v]) => root.setProperty(k, v));
  if (theme.accent) root.setProperty("--accent", theme.accent);
  if (p.vars || theme.accent) root.setProperty("--accent-soft", "color-mix(in srgb, var(--accent) 15%, var(--card))");
  $("accent-pick").value = theme.accent || (getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2f5d50");
  document.querySelectorAll(".swatch").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === theme.preset));
}

// 지금 화면 너비에 맞는 칸의 사진을 배경으로 적용
function applyBg() {
  const id = activeSlot(), data = getBg(id);
  $("bg-layer").style.backgroundImage = data ? `url("${data}")` : "none";
  $("bg-shade").style.opacity = data ? ((theme.dark[id] ?? 25) / 100).toString() : "0";
  document.body.classList.toggle("has-bg", !!data);
  $("device-now").textContent = "지금 이 화면은 「" + (id === "phone" ? "폰 화면" : "PC 화면") + "」 설정을 사용 중이에요.";
  renderSlots();
}

function shrinkImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽지 못했어요")); };
    img.src = url;
  });
}

function renderSlots() {
  const now = activeSlot();
  $("slots").innerHTML = SLOTS.map(sl => {
    const data = getBg(sl.id);
    return `<div class="slot" data-slot="${sl.id}">
      <div class="slot-head"><span>${sl.label}</span>${sl.id === now ? '<span class="now">사용 중</span>' : ""}</div>
      <div class="slot-thumb" ${data ? `style="background-image:url('${data}')"` : ""}>${data ? "" : "사진 없음"}</div>
      <div class="panel-row">
        <label class="btn-sm" for="file-${sl.id}" style="cursor:pointer">사진 고르기</label>
        <input type="file" id="file-${sl.id}" data-slot="${sl.id}" accept="image/*" hidden>
        <button class="btn-sm" type="button" data-remove="${sl.id}">지우기</button>
      </div>
      <div class="panel-row"><span>어둡게</span><input type="range" min="0" max="80" value="${theme.dark[sl.id] ?? 25}" data-dark="${sl.id}"></div>
    </div>`;
  }).join("");

  $("slots").querySelectorAll("input[type=file]").forEach(inp => inp.onchange = async (e) => {
    const id = inp.dataset.slot, f = e.target.files[0]; if (!f) return;
    try {
      const data = await shrinkImage(f, SLOTS.find(x => x.id === id).max);
      try { localStorage.setItem(bgKey(id), data); }
      catch (err) { alert("이 브라우저에는 사진을 저장할 공간이 부족해요. 더 작은 사진을 골라 주세요."); }
    } catch (err) { alert(err.message); }
    applyBg();
  });
  $("slots").querySelectorAll("[data-remove]").forEach(b => b.onclick = () => {
    try { localStorage.removeItem(bgKey(b.dataset.remove)); } catch (e) {}
    applyBg();
  });
  // 슬라이더는 드래그 중에 목록을 다시 그리지 않도록 투명도만 바로 바꿉니다
  $("slots").querySelectorAll("[data-dark]").forEach(r => r.oninput = () => {
    theme.dark[r.dataset.dark] = +r.value; saveTheme();
    if (r.dataset.dark === activeSlot() && getBg(r.dataset.dark)) $("bg-shade").style.opacity = (r.value / 100).toString();
  });
}

$("swatches").innerHTML = PRESETS.map(p =>
  `<button type="button" class="swatch" data-id="${p.id}" aria-pressed="false"><i style="background:${p.prev}"></i>${p.name}</button>`).join("");
$("swatches").querySelectorAll(".swatch").forEach(b => b.onclick = () => { theme.preset = b.dataset.id; theme.accent = null; saveTheme(); applyTheme(); });
$("accent-pick").oninput = (e) => { theme.accent = e.target.value; saveTheme(); applyTheme(); };
$("accent-reset").onclick = () => { theme.accent = null; saveTheme(); applyTheme(); };
$("theme-reset").onclick = () => {
  theme = { preset: "auto", accent: null, dark: { pc: 25, phone: 25 } };
  try { localStorage.removeItem(T_KEY); SLOTS.forEach(sl => localStorage.removeItem(bgKey(sl.id))); } catch (e) {}
  applyTheme(); applyBg();
};
$("paint-btn").onclick = () => $("theme-panel").classList.toggle("open");
$("panel-close").onclick = () => $("theme-panel").classList.remove("open");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("theme-panel").classList.remove("open"); });
phoneMQ.addEventListener("change", applyBg);   // 창 크기를 바꾸거나 폰을 돌리면 맞는 설정으로 전환

applyTheme(); applyBg();

/* ---------- 시작 ---------- */
renderCalendar();
loadData().then(d => { renderBriefing(d.briefing); renderTopics(d.topics); });
</script>
</body>
